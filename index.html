<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech AI | Video & Sound</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-glow: rgba(0, 242, 255, 0.9);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* باکگراوندێ ڤیدیۆ */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            object-fit: cover;
            filter: brightness(0.4); /* تاریکتر دا سپینەر دیار بیت */
        }

        /* بوتۆنا دەنگی */
        .sound-control {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 100;
            cursor: pointer;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .spinner-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-center {
            z-index: 30;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--brand-glow);
            box-shadow: 0 0 30px var(--brand-glow);
            position: absolute;
            overflow: hidden;
            background: #000;
        }

        .brand-center img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-name-overlay {
            position: absolute;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 5px 0;
        }

        .fidget-blades {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: fastSpin 12s linear infinite;
        }

        @keyframes fastSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .blade-arm {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 155px;
            background: linear-gradient(to bottom, var(--brand-glow), transparent);
            transform-origin: top center;
        }

        .icon-link {
            position: absolute;
            bottom: -35px;
            left: -33px;
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            animation: counterRotate 12s linear infinite;
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .arm-1 { transform: rotate(0deg); }
        .arm-2 { transform: rotate(90deg); }
        .arm-3 { transform: rotate(180deg); }
        .arm-4 { transform: rotate(270deg); }

        .tiktok { color: #000; }
        .instagram { color: #E1306C; }
        .telegram { color: #0088cc; }
        .message { color: #25D366; }

    </style>
</head>
<body>

    <!-- بوتۆنا دەنگی -->
    <div class="sound-control" onclick="toggleSound()">
        <i id="sound-icon" class="fas fa-volume-mute"></i>
    </div>

    <!-- ڤیدیۆ (بێ دەنگ دەستپێدەکەت دا بڕاوسەر ڕێ بدەت لێبدەت) -->
    <video playsinline autoplay muted loop id="bg-video">
        <source src="لینکێ_ڤیدیۆیا_تە.mp4" type="video/mp4">
    </video>

    <div class="spinner-wrapper">
        <div class="brand-center">
            <img src="https://i.ibb.co/vC2BLwm2/image.jpg" alt="Falah Tech AI">
            <div class="brand-name-overlay">TECH AI</div>
        </div>

        <div class="fidget-blades">
            <div class="blade-arm arm-1">
                <a href="https://www.tiktok.com/@_tech_ai_" target="_blank" class="icon-link tiktok"><i class="fab fa-tiktok"></i></a>
            </div>
            <div class="blade-arm arm-2">
                <a href="https://www.instagram.com/falahcanadi" target="_blank" class="icon-link instagram"><i class="fab fa-instagram"></i></a>
            </div>
            <div class="blade-arm arm-3">
                <a href="https://t.me/tech_ai_falah" target="_blank" class="icon-link telegram"><i class="fab fa-telegram"></i></a>
            </div>
            <div class="blade-arm arm-4">
                <a href="https://t.me/falahzakho" target="_blank" class="icon-link message"><i class="fas fa-comment-dots"></i></a>
            </div>
        </div>
    </div>

    <script>
        function toggleSound() {
            const video = document.getElementById('bg-video');
            const icon = document.getElementById('sound-icon');
            
            if (video.muted) {
                video.muted = false;
                icon.className = 'fas fa-volume-up';
            } else {
                video.muted = true;
                icon.className = 'fas fa-volume-mute';
            }
        }

        // هەولدان بۆ لێدانا ڤیدیۆیێ ب خۆکار (هندەک مۆبایل پێدڤی ب کلیکێ نە)
        document.addEventListener('click', () => {
            const video = document.getElementById('bg-video');
            if (video.paused) {
                video.play();
            }
        }, { once: true });
    </script>
</body>
</html>
