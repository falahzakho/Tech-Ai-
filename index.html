<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Rest | Modern Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        :root {
            --primary: #38bdf8;
            --accent: #fbbf24;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #fff;
            margin: 0;
            padding-bottom: 50px;
            min-height: 100vh;
        }

        /* Header */
        header {
            padding: 30px 20px;
            text-align: center;
        }

        header h1 { font-size: 2.5rem; margin: 0; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        header p { color: #94a3b8; margin-top: 5px; }

        /* Categories Bar */
        .categories-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .categories-container::-webkit-scrollbar { display: none; }

        .cat-btn {
            display: inline-block;
            padding: 10px 25px;
            margin: 0 8px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .cat-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        /* Food Section */
        .menu-section {
            padding: 20px;
            display: none;
        }

        .menu-section.active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .food-scroll {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 5px 30px 5px;
            scroll-snap-type: x mandatory;
        }

        .food-scroll::-webkit-scrollbar { height: 6px; }
        .food-scroll::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .food-card {
            flex: 0 0 280px;
            background: var(--card-bg);
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            scroll-snap-align: center;
            transition: 0.3s;
        }

        .food-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .food-img {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .food-info { padding: 20px; text-align: center; }
        .food-info h3 { margin: 0 0 10px 0; font-size: 1.3rem; }
        .price-tag {
            background: var(--accent);
            color: #000;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 900;
            display: inline-block;
        }

        /* Floating Contact Info (Zakho) */
        .location-tag {
            text-align: center;
            margin-top: 20px;
            color: var(--primary);
            font-weight: bold;
        }

    </style>
</head>
<body>

<header>
    <h1>TECH REST</h1>
    <p>تامی تایبەت ل زاخۆ</p>
</header>

<div class="categories-container" id="catBar">
    <!-- Categories will be injected here -->
</div>

<div id="menuContent">
    <!-- Food cards will be injected here -->
</div>

<div class="location-tag">
    <i class="fas fa-map-marker-alt"></i> زاخۆ - دەستپێکا رێکا پیشەسازی
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSRjwZs-DPmh8Cg7LwOa1HTa8m58e4LriIPHbkoxdNp-vcgkNHHsVnp89Dj_TE7xiDLMugKBJRtsBr/pub?output=csv';
    let dataList = [];

    async function loadData() {
        const res = await fetch(csvUrl);
        const txt = await res.text();
        const rows = txt.split('\n').slice(1);
        dataList = rows.map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
            return { name: c[0], price: c[1], img: c[2], cat: c[3], catImg: c[4] };
        }).filter(i => i.cat);
        
        renderMenu();
    }

    function renderMenu() {
        const catBar = document.getElementById('catBar');
        const menuContent = document.getElementById('menuContent');
        const cats = [...new Set(dataList.map(i => i.cat))];

        catBar.innerHTML = '';
        menuContent.innerHTML = '';

        cats.forEach((cat, index) => {
            // Create Category Button
            const btn = document.createElement('div');
            btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => switchCat(cat, btn);
            catBar.appendChild(btn);

            // Create Section for this Category
            const section = document.createElement('div');
            section.id = `section-${cat}`;
            section.className = `menu-section ${index === 0 ? 'active' : ''}`;
            
            const scrollDiv = document.createElement('div');
            scrollDiv.className = 'food-scroll';
            
            const foods = dataList.filter(f => f.cat === cat);
            foods.forEach(food => {
                scrollDiv.innerHTML += `
                    <div class="food-card">
                        <div class="food-img" style="background-image: url('${food.img}')"></div>
                        <div class="food-info">
                            <h3>${food.name}</h3>
                            <div class="price-tag">${food.price}</div>
                        </div>
                    </div>
                `;
            });

            section.appendChild(scrollDiv);
            menuContent.appendChild(section);
        });
    }

    function switchCat(catName, btn) {
        // Update Buttons
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Update Sections
        document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('active'));
        document.getElementById(`section-${catName}`).classList.add('active');
    }

    loadData();
</script>
</body>
</html>
