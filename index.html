<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Rest | Spinner Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        :root {
            --primary: #38bdf8;
            --accent: #fbbf24;
            --bg-dark: #020617;
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Spinner Section --- */
        .hero-spinner {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .center-logo {
            position: absolute;
            z-index: 10;
            text-align: center;
            background: rgba(2, 6, 23, 0.8);
            padding: 20px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            width: 140px;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(56, 189, 248, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        }

        .center-logo h2 { margin: 0; font-size: 1.2rem; color: var(--primary); font-weight: 900; }
        .center-logo span { font-size: 0.8rem; color: var(--accent); }

        .spinner-container {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 1px dashed var(--glass-border);
            animation: rotateSpinner 20s linear infinite;
        }

        @keyframes rotateSpinner {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cat-item {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            animation: counterRotate 20s linear infinite;
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .cat-item:hover {
            background: var(--primary);
            border-color: #fff;
            transform: scale(1.1);
        }

        .cat-item i { font-size: 1.5rem; color: var(--accent); margin-bottom: 5px; }
        .cat-item span { font-size: 0.7rem; font-weight: 700; text-align: center; }

        /* --- Food List Section --- */
        #foodSection {
            padding: 20px;
            background: #020617;
            min-height: 100vh;
            display: none;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .food-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        .food-photo { width: 100%; height: 120px; object-fit: cover; }
        .food-info { padding: 10px; text-align: center; }
        .food-info h3 { font-size: 0.85rem; margin: 0; height: 35px; }
        .price-tag { color: var(--primary); font-weight: 800; font-size: 0.8rem; }

        .back-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* Positioning Items around Circle */
        .item-1 { top: -40px; left: 110px; }
        .item-2 { top: 60px; right: -40px; }
        .item-3 { bottom: -40px; left: 110px; }
        .item-4 { top: 60px; left: -40px; }

    </style>
</head>
<body>

<div id="homePage" class="hero-spinner">
    <div class="center-logo">
        <h2>Tech Rest</h2>
        <span>ب خێرهاتی</span>
    </div>

    <div class="spinner-container" id="catGrid">
        <!-- ب رێکا JS جۆرێن خارنێ لێرە دکەڤنە د ناڤ بازنەیی دا -->
    </div>
</div>

<div id="foodSection">
    <button class="back-btn" onclick="showHome()">
        <i class="fas fa-chevron-right"></i> ڤەگەر بۆ سەرەکی
    </button>
    <h2 id="catTitle" style="text-align: center; color: var(--accent);"></h2>
    <div class="food-grid" id="foodGrid"></div>
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSRjwZs-DPmh8Cg7LwOa1HTa8m58e4LriIPHbkoxdNp-vcgkNHHsVnp89Dj_TE7xiDLMugKBJRtsBr/pub?output=csv';
    let dataList = [];

    // ئایکۆنەکان بەپێی ناوی بەشەکان (دەتوانی لێرە بیگۆڕی)
    const icons = {
        "برگر": "fa-burger",
        "پیتزا": "fa-pizza-slice",
        "سەندویچ": "fa-hotdog",
        "خوارن": "fa-utensils",
        "نوشین": "fa-glass-water"
    };

    async function loadData() {
        const res = await fetch(csvUrl);
        const txt = await res.text();
        const rows = txt.split('\n').slice(1);
        dataList = rows.map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
            return { name: c[0], price: c[1], img: c[2], cat: c[3] };
        }).filter(i => i.cat);
        renderSpinner();
    }

    function renderSpinner() {
        const grid = document.getElementById('catGrid');
        const categories = [...new Set(dataList.map(i => i.cat))];
        grid.innerHTML = '';

        categories.forEach((cat, index) => {
            const iconClass = icons[cat] || "fa-utensils";
            const angle = (index / categories.length) * 360;
            // دانانی ئایتمەکان بە شێوەی بازنەیی
            const x = 150 + 140 * Math.cos(angle * Math.PI / 180) - 40;
            const y = 150 + 140 * Math.sin(angle * Math.PI / 180) - 40;

            grid.innerHTML += `
                <div class="cat-item" style="left: ${x}px; top: ${y}px;" onclick="openCat('${cat}')">
                    <i class="fas ${iconClass}"></i>
                    <span>${cat}</span>
                </div>`;
        });
    }

    function openCat(catName) {
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('foodSection').style.display = 'block';
        document.getElementById('catTitle').innerText = catName;
        
        const grid = document.getElementById('foodGrid');
        grid.innerHTML = '';
        dataList.filter(i => i.cat === catName).forEach(item => {
            grid.innerHTML += `
                <div class="food-card">
                    <img src="${item.img}" class="food-photo">
                    <div class="food-info">
                        <h3>${item.name}</h3>
                        <span class="price-tag">${item.price}</span>
                    </div>
                </div>`;
        });
    }

    function showHome() {
        document.getElementById('homePage').style.display = 'flex';
        document.getElementById('foodSection').style.display = 'none';
    }

    loadData();
</script>
</body>
</html>
