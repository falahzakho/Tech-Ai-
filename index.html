<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech AI | Maldives Bio Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1920&q=80');
            --overlay: rgba(0, 20, 40, 0.8);
            --text-color: #00f2ff;
        }

        [data-theme="light"] {
            --overlay: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(var(--overlay), var(--overlay)), var(--bg-image);
            background-size: cover;
            background-position: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            transition: background 1s ease-in-out;
        }

        /* دوگمەیا ماکی/دەنگی ل لایێ چەپێ */
        .audio-control {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 100;
            cursor: pointer;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            font-size: 1.5rem;
            transition: 0.3s;
        }

        /* دوگمەیا مۆدی ل لایێ ڕاستێ */
        .theme-switch {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 100;
            cursor: pointer;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            font-size: 1.5rem;
            transition: 0.5s;
        }

        [data-theme="light"] .theme-switch {
            background: rgba(0,0,0,0.1);
            color: #ffaa00;
            transform: rotate(180deg);
        }

        .welcome-msg {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: var(--text-color);
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .container {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .brand-name {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(0,0,0,0.8);
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rotateOrbit 20s linear infinite;
        }

        .icon-link {
            position: absolute;
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 1.8rem;
            transition: 0.4s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .icon-link:hover { transform: scale(1.2); box-shadow: 0 0 20px var(--text-color); }

        .tiktok { top: -32px; left: 50%; transform: translateX(-50%); color: #000; }
        .instagram { bottom: -32px; left: 50%; transform: translateX(-50%); color: #E1306C; }
        .telegram { top: 50%; left: -32px; transform: translateY(-50%); color: #0088cc; }

        @keyframes rotateOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .wave-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: url('https://raw.githubusercontent.com/yusif-adeel/waves/main/wave.png');
            background-size: 1000px 100px;
            opacity: 0.3;
            animation: waveAnim 10s linear infinite;
        }

        @keyframes waveAnim {
            from { background-position-x: 0; }
            to { background-position-x: 1000px; }
        }

        .bottom-msg {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="wave-bottom"></div>

    <div class="audio-control" onclick="toggleAudio()">
        <i id="audio-icon" class="fas fa-microphone"></i>
    </div>

    <div class="theme-switch" onclick="toggleTheme()">
        <i id="theme-icon" class="fas fa-moon"></i>
    </div>

    <div class="welcome-msg" id="welcome-text">welcome</div>

    <div class="container">
        <div class="brand-name">Tech Ai</div>
        <div class="orbit">
            <a href="https://www.tiktok.com/@_tech_ai_" target="_blank" class="icon-link tiktok"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.instagram.com/falahcanadi" target="_blank" class="icon-link instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://t.me/tech_ai_falah" target="_blank" class="icon-link telegram"><i class="fab fa-telegram"></i></a>
        </div>
    </div>

    <a href="https://t.me/falahzakho" target="_blank" class="bottom-msg">
        <i class="fas fa-envelope"></i>
        <span>Message</span>
    </a>

    <audio id="seaSound" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/1120/1120-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const welcomeText = document.getElementById('welcome-text');
        const messages = ["welcome", "بخێر بێی"];
        let msgIndex = 0;
        setInterval(() => {
            msgIndex = (msgIndex + 1) % messages.length;
            welcomeText.innerText = messages[msgIndex];
        }, 2000);

        const sound = document.getElementById('seaSound');
        const audioIcon = document.getElementById('audio-icon');

        // فەنکشنا کۆنترۆلکرنا دەنگی ب ئایکۆنێ ماکی
        function toggleAudio() {
            if (sound.paused) {
                sound.play();
                audioIcon.className = 'fas fa-microphone';
                audioIcon.parentElement.style.background = "rgba(0, 212, 255, 0.4)";
            } else {
                sound.pause();
                audioIcon.className = 'fas fa-microphone-slash';
                audioIcon.parentElement.style.background = "rgba(255, 255, 255, 0.2)";
            }
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fas fa-sun';
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fas fa-moon';
            }
        }

        // کارپێکرن ب کلیکا ئێکێ
        document.addEventListener('click', () => {
            if(sound.paused && audioIcon.className === 'fas fa-microphone') {
                sound.play();
            }
        }, { once: true });
    </script>
</body>
</html>
