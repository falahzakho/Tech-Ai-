<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Rest | Curved Spinner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        :root {
            --primary: #38bdf8;
            --accent: #fbbf24;
            --bg-dark: #020617;
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #fff;
            margin: 0;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-display {
            position: absolute;
            z-index: 10;
            text-align: center;
            background: rgba(2, 6, 23, 0.9);
            padding: 20px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
            width: 130px;
            height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .center-display h2 { margin: 0; font-size: 1rem; color: var(--primary); font-weight: 900; }

        .spinner-container {
            position: relative;
            width: 380px;
            height: 380px;
            animation: rotateSpinner 40s linear infinite;
        }

        @keyframes rotateSpinner {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .item-node {
            position: absolute;
            width: 120px;
            height: 120px;
            cursor: pointer;
            animation: counterRotate 40s linear infinite;
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        svg { width: 100%; height: 100%; overflow: visible; }
        
        .curved-text {
            fill: #fff;
            font-size: 10px;
            font-weight: 900;
            text-shadow: 1px 1px 2px #000;
        }

        .price-text {
            fill: var(--accent);
            font-size: 9px;
            font-weight: 900;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: none;
            box-shadow: 0 0 15px var(--primary);
        }
    </style>
</head>
<body>

<button class="back-btn" id="backBtn" onclick="showCategories()">
    <i class="fas fa-arrow-right"></i>
</button>

<div id="catView" class="spinner-wrapper">
    <div class="center-display">
        <h2>Tech Rest</h2>
    </div>
    <div class="spinner-container" id="catGrid"></div>
</div>

<div id="foodView" class="spinner-wrapper" style="display: none;">
    <div class="center-display">
        <h2 id="midName">Tech Rest</h2>
        <span id="midPrice" style="color:var(--accent); font-weight:bold; margin-top:5px;"></span>
    </div>
    <div class="spinner-container" id="foodGrid"></div>
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSRjwZs-DPmh8Cg7LwOa1HTa8m58e4LriIPHbkoxdNp-vcgkNHHsVnp89Dj_TE7xiDLMugKBJRtsBr/pub?output=csv';
    let dataList = [];

    async function loadData() {
        const res = await fetch(csvUrl);
        const txt = await res.text();
        const rows = txt.split('\n').slice(1);
        dataList = rows.map(r => {
            const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
            return { name: c[0], price: c[1], img: c[2], cat: c[3], catImg: c[4] };
        }).filter(i => i.cat);
        renderCategories();
    }

    function renderCategories() {
        const grid = document.getElementById('catGrid');
        const cats = [...new Set(dataList.map(i => i.cat))];
        grid.innerHTML = '';

        cats.forEach((cat, i) => {
            const item = dataList.find(d => d.cat === cat);
            const pos = getPos(i, cats.length, 160);
            grid.innerHTML += createNode(pos, item.catImg, cat, '', `onclick="openFoods('${cat}')"`);
        });
    }

    function openFoods(catName) {
        document.getElementById('catView').style.display = 'none';
        document.getElementById('foodView').style.display = 'flex';
        document.getElementById('backBtn').style.display = 'block';
        
        const grid = document.getElementById('foodGrid');
        const foods = dataList.filter(d => d.cat === catName);
        grid.innerHTML = '';

        foods.forEach((f, i) => {
            const pos = getPos(i, foods.length, 160);
            grid.innerHTML += createNode(pos, f.img, f.name, f.price, `onclick="setMid('${f.name}','${f.price}')"`);
        });
        if(foods.length > 0) setMid(foods[0].name, foods[0].price);
    }

    function createNode(pos, img, name, price, action) {
        const uniqueId = 'path-' + Math.random().toString(36).substr(2, 9);
        return `
            <div class="item-node" style="left:${pos.x}px; top:${pos.y}px" ${action}>
                <svg viewBox="0 0 120 120">
                    <defs>
                        <path id="${uniqueId}-top" d="M 20,60 A 40,40 0 1,1 100,60" />
                        <path id="${uniqueId}-bottom" d="M 20,60 A 40,40 0 1,0 100,60" />
                        <clipPath id="circleView"><circle cx="60" cy="60" r="40" /></clipPath>
                    </defs>
                    <image href="${img}" x="20" y="20" width="80" height="80" clip-path="url(#circleView)" preserveAspectRatio="xMidYMid slice" />
                    <circle cx="60" cy="60" r="41" fill="none" stroke="var(--primary)" stroke-width="2" />
                    <text class="curved-text">
                        <textPath href="#${uniqueId}-top" startOffset="50%" text-anchor="middle">${name}</textPath>
                    </text>
                    ${price ? `
                    <text class="price-text">
                        <textPath href="#${uniqueId}-bottom" startOffset="50%" text-anchor="middle">${price}</textPath>
                    </text>` : ''}
                </svg>
            </div>`;
    }

    function getPos(i, total, dist) {
        const angle = (i / total) * 360;
        return {
            x: 190 + dist * Math.cos(angle * Math.PI / 180) - 60,
            y: 190 + dist * Math.sin(angle * Math.PI / 180) - 60
        };
    }

    function setMid(n, p) {
        document.getElementById('midName').innerText = n;
        document.getElementById('midPrice').innerText = p;
    }

    function showCategories() {
        document.getElementById('catView').style.display = 'flex';
        document.getElementById('foodView').style.display = 'none';
        document.getElementById('backBtn').style.display = 'none';
    }

    loadData();
</script>
</body>
</html>
