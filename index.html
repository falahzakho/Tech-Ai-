<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Rest | Double Spinner Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        :root {
            --primary: #38bdf8;
            --accent: #fbbf24;
            --bg-dark: #020617;
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #fff;
            margin: 0;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Global Spinner Styles --- */
        .spinner-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.5s ease-in-out;
        }

        .center-display {
            position: absolute;
            z-index: 10;
            text-align: center;
            background: rgba(2, 6, 23, 0.9);
            padding: 20px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
            width: 140px;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .center-display h2 { margin: 0; font-size: 1rem; color: var(--primary); font-weight: 900; }
        .center-display .price { font-size: 1.1rem; color: var(--accent); font-weight: 900; margin-top: 5px; }

        .spinner-container {
            position: relative;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 1px dashed var(--glass-border);
            animation: rotateSpinner 30s linear infinite;
        }

        @keyframes rotateSpinner {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .item-circle {
            position: absolute;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 2px solid var(--glass-border);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: 0.3s;
            animation: counterRotate 30s linear infinite;
            background-size: cover;
            background-position: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .item-circle::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }

        .item-circle span {
            position: relative;
            z-index: 2;
            font-size: 0.7rem;
            font-weight: 900;
            padding-bottom: 8px;
            color: #fff;
            text-align: center;
        }

        .item-circle:hover { border-color: var(--primary); transform: scale(1.1); }

        /* --- Navigation --- */
        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: none;
            box-shadow: 0 0 15px var(--primary);
        }

    </style>
</head>
<body>

<button class="back-btn" id="backBtn" onclick="showCategories()">
    <i class="fas fa-arrow-right"></i>
</button>

<!-- Main Categories Spinner -->
<div id="catView" class="spinner-wrapper">
    <div class="center-display">
        <h2>Tech Rest</h2>
        <span style="font-size: 0.7rem; color: var(--accent);">زاخۆ</span>
    </div>
    <div class="spinner-container" id="catGrid"></div>
</div>

<!-- Food Items Spinner -->
<div id="foodView" class="spinner-wrapper" style="display: none;">
    <div class="center-display" id="foodCenter">
        <h2 id="selectedFoodName">ناڤێ خارنێ</h2>
        <span class="price" id="selectedFoodPrice">0 IQD</span>
    </div>
    <div class="spinner-container" id="foodGrid"></div>
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSRjwZs-DPmh8Cg7LwOa1HTa8m58e4LriIPHbkoxdNp-vcgkNHHsVnp89Dj_TE7xiDLMugKBJRtsBr/pub?output=csv';
    let dataList = [];

    async function loadData() {
        try {
            const res = await fetch(csvUrl);
            const txt = await res.text();
            const rows = txt.split('\n').slice(1);
            dataList = rows.map(r => {
                const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                return { name: c[0], price: c[1], img: c[2], cat: c[3], catImg: c[4] };
            }).filter(i => i.cat);
            renderCategorySpinner();
        } catch(e) { console.error("Error loading data:", e); }
    }

    function renderCategorySpinner() {
        const grid = document.getElementById('catGrid');
        const categories = [...new Set(dataList.map(i => i.cat))];
        grid.innerHTML = '';

        categories.forEach((cat, index) => {
            const itemData = dataList.find(i => i.cat === cat);
            const angle = (index / categories.length) * 360;
            const pos = calculatePosition(angle, 155);

            grid.innerHTML += `
                <div class="item-circle" 
                     style="left: ${pos.x}px; top: ${pos.y}px; background-image: url('${itemData.catImg}');" 
                     onclick="openFoodSpinner('${cat}')">
                    <span>${cat}</span>
                </div>`;
        });
    }

    function openFoodSpinner(catName) {
        document.getElementById('catView').style.display = 'none';
        document.getElementById('foodView').style.display = 'flex';
        document.getElementById('backBtn').style.display = 'block';
        
        const grid = document.getElementById('foodGrid');
        const filteredFoods = dataList.filter(i => i.cat === catName);
        grid.innerHTML = '';

        filteredFoods.forEach((food, index) => {
            const angle = (index / filteredFoods.length) * 360;
            const pos = calculatePosition(angle, 155);

            grid.innerHTML += `
                <div class="item-circle" 
                     style="left: ${pos.x}px; top: ${pos.y}px; background-image: url('${food.img}');" 
                     onmouseover="updateCenter('${food.name}', '${food.price}')"
                     onclick="updateCenter('${food.name}', '${food.price}')">
                    <span>${food.name}</span>
                </div>`;
        });
        
        // ناوی یەکەم خواردن نیشان بدە لە ناوەڕاست
        if(filteredFoods.length > 0) updateCenter(filteredFoods[0].name, filteredFoods[0].price);
    }

    function updateCenter(name, price) {
        document.getElementById('selectedFoodName').innerText = name;
        document.getElementById('selectedFoodPrice').innerText = price;
    }

    function showCategories() {
        document.getElementById('catView').style.display = 'flex';
        document.getElementById('foodView').style.display = 'none';
        document.getElementById('backBtn').style.display = 'none';
    }

    function calculatePosition(angle, distance) {
        const radius = 170; // نێوەندی بازنە گەورەکە
        const x = radius + distance * Math.cos(angle * Math.PI / 180) - 47;
        const y = radius + distance * Math.sin(angle * Math.PI / 180) - 47;
        return { x, y };
    }

    loadData();
</script>
</body>
</html>
