<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech AI Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background: #1a1a1a; /* رەنگێ پشت بنەمایێ تاری */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .main-container {
            position: relative;
            width: 800px;
            height: 500px;
            display: flex;
            align-items: center;
        }

        /* بازنێ مەزن یێ جیهانێ */
        .earth-circle {
            width: 350px;
            height: 350px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png') no-repeat center;
            background-size: cover;
            border-radius: 50%;
            border: 15px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 2;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.3);
        }

        /* هێلا نیڤ بازنە */
        .arc-line {
            position: absolute;
            width: 450px;
            height: 450px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            left: -50px;
            z-index: 1;
            clip-path: inset(0 0 0 50%); /* بتنێ رەخێ راستێ نیشان ددەت */
        }

        .menu-items {
            position: absolute;
            left: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .item {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .item:hover {
            transform: translateX(10px);
        }

        /* بازنێ بچووک یێ ئایکۆنێ */
        .icon-circle {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            z-index: 3;
            border: 2px solid #333;
        }

        /* نیشانده‌رێ ره‌ش یێ درێژ */
        .label {
            background: #222;
            padding: 15px 40px;
            border-radius: 0 30px 30px 0;
            margin-left: -30px;
            width: 180px;
            font-weight: bold;
            font-size: 18px;
            border-left: 2px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .number {
            font-size: 12px;
            color: #aaa;
            border: 1px solid #aaa;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* رەنگێن ئایکۆنان */
        .fa-facebook-f { color: #1877F2; }
        .fa-instagram { color: #E4405F; }
        .fa-tiktok { color: #000; }
        .fa-telegram { color: #229ED9; }
        .fa-envelope { color: #444; }

    </style>
</head>
<body>

<div class="main-container">
    <div class="earth-circle"></div>
    
    <div class="arc-line"></div>

    <div class="menu-items">
        
        <a href="https://www.facebook.com/share/185AGVtNad/?mibextid=wwXIfr" class="item" target="_blank">
            <div class="icon-circle"><i class="fab fa-facebook-f"></i></div>
            <div class="label"><span>Facebook</span> <span class="number">01</span></div>
        </a>

        <a href="https://www.instagram.com/falahcanadi?igsh=dmwwdWduazEwZHZz&utm_source=qr" class="item" target="_blank">
            <div class="icon-circle"><i class="fab fa-instagram"></i></div>
            <div class="label"><span>Instagram</span> <span class="number">02</span></div>
        </a>

        <a href="https://www.tiktok.com/@_tech_ai_?_r=1&_t=ZS-969xsGlKXkQ" class="item" target="_blank">
            <div class="icon-circle"><i class="fab fa-tiktok"></i></div>
            <div class="label"><span>TikTok</span> <span class="number">03</span></div>
        </a>

        <a href="https://t.me/tech_ai_falah" class="item" target="_blank">
            <div class="icon-circle"><i class="fab fa-telegram"></i></div>
            <div class="label"><span>Telegram</span> <span class="number">04</span></div>
        </a>

        <a href="https://t.me/falahzakho_" class="item" target="_blank">
            <div class="icon-circle"><i class="fas fa-envelope"></i></div>
            <div class="label"><span>Message</span> <span class="number">05</span></div>
        </a>

    </div>
</div>

</body>
</html>
