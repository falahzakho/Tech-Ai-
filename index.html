<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech AI Rotating Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #1a1a1a; /* رەنگێ پشت بنەما */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* بازنەیا زۆرۆک */
        .rotating-container {
            position: relative;
            width: 300px;
            height: 300px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateCircle 10s linear infinite; /* ئەنیمەیشنا زۆرینێ */
        }

        /* ئەنیمەیشنا زۆرینا بازنەیێ */
        @keyframes rotateCircle {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ستایلێ ئیکۆنان */
        .icon-link {
            position: absolute;
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 35px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        /* دا کو ئیکۆن ب خۆ نەزۆرن و راست بمینن */
        .icon-link i {
            animation: counterRotate 10s linear infinite;
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* دیارکرنا جهێ ئیکۆنان ل سەر بازنەیێ */
        .insta { 
            top: -35px; 
            color: #E1306C;
        }
        .tiktok { 
            bottom: 20px; 
            left: -35px; 
            color: #000;
        }
        .telegram { 
            bottom: 20px; 
            right: -35px; 
            color: #0088cc;
        }

        /* ناڤێ لاپەری ل ناڤەڕاستێ */
        .center-text {
            position: absolute;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 10px #00ffcc;
            z-index: 10;
        }

        .icon-link:hover {
            box-shadow: 0 0 30px #fff;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="center-text">Tech AI</div>

    <div class="rotating-container">
        <a href="https://www.instagram.com/__tech_.ai._?igsh=MTZ2ZGIxcXB2YjVjaw%3D%3D&utm_source=qr" class="icon-link insta" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>

        <a href="https://www.tiktok.com/@_tech_ai_?_r=1&_t=ZS-9697e0v56Go" class="icon-link tiktok" target="_blank">
            <i class="fab fa-tiktok"></i>
        </a>

        <a href="https://t.me/tech_ai_falah" class="icon-link telegram" target="_blank">
            <i class="fab fa-telegram"></i>
        </a>
    </div>

</body>
</html>
