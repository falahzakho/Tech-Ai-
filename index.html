<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech AI - Responsive Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .main-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: row; /* ل سەر کۆمپیوتەری ب رەخ ئێک ڤە */
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* بازنێ مەزن یێ جیهانێ */
        .earth-circle {
            width: 300px;
            height: 300px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png') no-repeat center;
            background-size: cover;
            border-radius: 50%;
            border: 10px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.3);
            flex-shrink: 0;
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-left: -50px; /* دا کێمەک ب چیتە سەر جیهانێ وەک وێنەی */
            z-index: 3;
        }

        .item {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .item:hover {
            transform: translateX(10px);
        }

        .icon-circle {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
            z-index: 4;
        }

        .label {
            background: #222;
            padding: 12px 30px 12px 40px;
            border-radius: 0 30px 30px 0;
            margin-left: -25px;
            width: 180px;
            font-weight: bold;
            font-size: 16px;
            border-left: 2px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .number {
            font-size: 10px;
            color: #aaa;
            border: 1px solid #aaa;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* رەنگێن ئایکۆنان */
        .fa-facebook-f { color: #1877F2; }
        .fa-instagram { color: #E4405F; }
        .fa-tiktok { color: #000; }
        .fa-telegram { color: #229ED9; }
        .fa-envelope { color: #555; }

        /* --- گۆهۆڕین بۆ مۆبایلێ (Responsive) --- */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column; /* جیهان دێ کەڤیتە سەر و لینک دێ کەڤنە خوار */
                gap: 30px;
            }

            .earth-circle {
                width: 200px;
                height: 200px;
            }

            .menu-items {
                margin-left: 0; /* ل سەر مۆبایلێ پێدڤی ب لادانێ نینە */
                align-items: center;
                width: 100%;
            }

            .label {
                width: 200px; /* ل سەر مۆبایلێ کێمەکا مەزنتر بیت جوانترە */
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="earth-circle"></div>
    
    <div class="menu-items">
        <a href="https://www.facebook.com/share/185AGVtNad/?mibextid=wwXIfr" class="item" target="_blank">
            <div class="icon-circle"><i class="fab fa-facebook-f"></i></div>
            <div class="label"><span>Facebook</span> <span class="number">01</span></div>
        </a>

        <a href="https://www.instagram.com/falahcanadi?igsh=dmwwdWduazEwZHZz&utm_source=qr" class="item" target="_blank">
            <div class="icon-circle"><i class="fab fa-instagram"></i></div>
            <div class="label"><span>Instagram</span> <span class="number">02</span></div>
        </a>

        <a href="https://www.tiktok.com/@_tech_ai_?_r=1&_t=ZS-969xsGlKXkQ" class="item" target="_blank">
            <div class="icon-circle"><i class="fab fa-tiktok"></i></div>
            <div class="label"><span>TikTok</span> <span class="number">03</span></div>
        </a>

        <a href="https://t.me/tech_ai_falah" class="item" target="_blank">
            <div class="icon-circle"><i class="fab fa-telegram"></i></div>
            <div class="label"><span>Telegram</span> <span class="number">04</span></div>
        </a>

        <a href="https://t.me/falahzakho_" class="item" target="_blank">
            <div class="icon-circle"><i class="fas fa-envelope"></i></div>
            <div class="label"><span>Message</span> <span class="number">05</span></div>
        </a>
    </div>
</div>

</body>
</html>
