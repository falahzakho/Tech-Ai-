<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech AI - Circular Infographic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2c3e50, #000000);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .infographic-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* بازنێ سەنتەری */
        .center-node {
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.5);
            border: 5px solid #00f2ff;
            text-align: center;
        }

        .center-node h2 {
            color: #1a1a1a;
            font-size: 20px;
            font-weight: bold;
        }

        /* بازنێ مەزن یێ دەرڤە */
        .main-ring {
            position: absolute;
            width: 380px;
            height: 380px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: rotateRing 20s linear infinite;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ستایلێ هەر لینکەکێ (Step) */
        .step {
            position: absolute;
            width: 90px;
            height: 90px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 3px solid white;
        }

        .step i {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .step:hover {
            transform: scale(1.2);
            z-index: 20;
            box-shadow: 0 0 25px currentColor;
        }

        /* دیارکرنا جهێ هەر لینکەکێ ب شێوازێ بازنەیی */
        .fb { background: #1877F2; top: 10%; left: 50%; transform: translate(-50%, -50%); }
        .ig { background: #E4405F; top: 40%; right: -5%; transform: translateY(-50%); }
        .tk { background: #000000; bottom: 5%; right: 15%; transform: translate(-50%, -50%); }
        .tg { background: #229ED9; bottom: 5%; left: 15%; transform: translate(50%, -50%); }
        .ms { background: #0088cc; top: 40%; left: -5%; transform: translateY(-50%); }

        /* مۆبایل */
        @media (max-width: 600px) {
            .infographic-container {
                width: 350px;
                height: 350px;
            }
            .main-ring {
                width: 280px;
                height: 280px;
            }
            .step {
                width: 70px;
                height: 70px;
                font-size: 10px;
            }
            .step i { font-size: 18px; }
            .center-node { width: 100px; height: 100px; }
            .center-node h2 { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="infographic-container">
        <div class="center-node">
            <h2>Tech AI</h2>
            <small>Solutions</small>
        </div>

        <div class="main-ring"></div>

        <a href="https://www.facebook.com/share/185AGVtNad/?mibextid=wwXIfr" class="step fb" target="_blank">
            <i class="fab fa-facebook-f"></i>
            <span>01 Step</span>
        </a>

        <a href="https://www.instagram.com/falahcanadi?igsh=dmwwdWduazEwZHZz&utm_source=qr" class="step ig" target="_blank">
            <i class="fab fa-instagram"></i>
            <span>02 Step</span>
        </a>

        <a href="https://www.tiktok.com/@_tech_ai_?_r=1&_t=ZS-969xsGlKXkQ" class="step tk" target="_blank">
            <i class="fab fa-tiktok"></i>
            <span>03 Step</span>
        </a>

        <a href="https://t.me/tech_ai_falah" class="step tg" target="_blank">
            <i class="fab fa-telegram"></i>
            <span>04 Step</span>
        </a>

        <a href="https://t.me/falahzakho_" class="step ms" target="_blank">
            <i class="fas fa-envelope"></i>
            <span>05 Step</span>
        </a>
    </div>

</body>
</html>
