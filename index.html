<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech AI | Video Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --text-color: #00f2ff;
            --brand-glow: rgba(0, 242, 255, 0.7);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ڤیدیۆیا باکگراوند */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            object-fit: cover;
        }

        /* پەردەکا تاریک ل سەر ڤیدیۆیێ بۆ جوانیێ */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 15, 30, 0.5);
            z-index: -90;
        }

        .welcome-msg {
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 50px;
            color: white;
            text-shadow: 0 0 20px var(--brand-glow);
            z-index: 10;
        }

        .spinner-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .brand-center {
            z-index: 30;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.6rem;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 0 30px var(--brand-glow);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 20px var(--brand-glow); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px var(--brand-glow); }
            100% { transform: scale(1); box-shadow: 0 0 20px var(--brand-glow); }
        }

        .fidget-blades {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: fastSpin 10s linear infinite;
        }

        @keyframes fastSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .blade-arm {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 140px;
            background: rgba(255, 255, 255, 0.2);
            transform-origin: top center;
        }

        .icon-link {
            position: absolute;
            bottom: -30px;
            left: -32px;
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 1.8rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            animation: counterRotate 10s linear infinite;
            transition: 0.3s;
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .arm-1 { transform: rotate(0deg); }
        .arm-2 { transform: rotate(120deg); }
        .arm-3 { transform: rotate(240deg); }

        .tiktok { color: #000; }
        .instagram { color: #E1306C; }
        .telegram { color: #0088cc; }

        .bottom-msg {
            position: fixed;
            bottom: 25px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 12px 28px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 100;
            transition: 0.3s;
        }
        .bottom-msg:hover { background: rgba(0, 242, 255, 0.4); }

    </style>
</head>
<body>

    <!-- باکگراوندێ ڤیدیۆ -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="لینکێ_ڤیدیۆیا_تە.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="welcome-msg" id="welcome-text">welcome</div>

    <div class="spinner-wrapper">
        <div class="brand-center">Tech Ai</div>

        <div class="fidget-blades">
            <div class="blade-arm arm-1">
                <a href="https://www.tiktok.com/@_tech_ai_" target="_blank" class="icon-link tiktok"><i class="fab fa-tiktok"></i></a>
            </div>
            <div class="blade-arm arm-2">
                <a href="https://www.instagram.com/falahcanadi" target="_blank" class="icon-link instagram"><i class="fab fa-instagram"></i></a>
            </div>
            <div class="blade-arm arm-3">
                <a href="https://t.me/tech_ai_falah" target="_blank" class="icon-link telegram"><i class="fab fa-telegram"></i></a>
            </div>
        </div>
    </div>

    <a href="https://t.me/falahzakho" target="_blank" class="bottom-msg">
        <i class="fas fa-envelope"></i>
        <span>Message</span>
    </a>

    <script>
        const welcomeText = document.getElementById('welcome-text');
        const messages = ["welcome", "بخێر بێی"];
        let msgIndex = 0;
        setInterval(() => {
            msgIndex = (msgIndex + 1) % messages.length;
            welcomeText.innerText = messages[msgIndex];
        }, 2000);
    </script>
</body>
</html>
