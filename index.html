<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech AI - Link Bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* وێنەیێ مالدیڤ وەک باکگراوند */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 600px;
            display: flex;
            flex-direction: row-reverse; /* دێ رەخێ راستێ کەتە ئەولەویەت */
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        /* لایێ راستێ: بازنێ AI */
        .ai-section {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ai-globe {
            width: 100%;
            height: 100%;
            background: url('https://cdn-icons-png.flaticon.com/512/2103/2103832.png'); /* نیشانا AI */
            background-size: cover;
            border-radius: 50%;
            filter: drop-shadow(0 0 30px #00f2ff);
            animation: rotateGlobe 10s linear infinite;
            z-index: 2;
        }

        /* بروسکێن کارەبێ (Electric Sparks) */
        .sparks {
            position: absolute;
            width: 120%;
            height: 120%;
            border: 2px dashed #00f2ff;
            border-radius: 50%;
            animation: pulse 1.5s infinite alternate, rotateGlobe 5s linear infinite reverse;
            opacity: 0.5;
        }

        @keyframes rotateGlobe {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.3; }
            to { transform: scale(1.1); opacity: 0.7; }
        }

        /* لایێ چەپێ: تیر و لینک */
        .links-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 5;
        }

        .arrow-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            position: relative;
            transition: 0.4s;
            /* دروستکرنا شێوێ سهمێ (Arrow) */
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 30px;
            border-radius: 50px 5px 5px 50px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            width: 250px;
            justify-content: flex-start;
        }

        .arrow-link::after {
            content: '';
            position: absolute;
            right: -20px;
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
            border-left: 20px solid rgba(0, 0, 0, 0.7);
        }

        .arrow-link:hover {
            transform: translateX(-15px);
            background: #00f2ff;
            color: black;
        }

        .arrow-link:hover::after {
            border-left-color: #00f2ff;
        }

        .icon-circle {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-right: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* رەنگێن ئایکۆنان */
        .fa-facebook-f { color: #1877F2; }
        .fa-instagram { color: #E4405F; }
        .fa-tiktok { color: #000; }
        .fa-telegram { color: #229ED9; }
        .fa-envelope { color: #ff9800; }

        /* مۆبایل */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                justify-content: center;
                gap: 50px;
                padding-top: 100px;
            }
            .ai-globe {
                width: 200px;
                height: 200px;
            }
            .links-section {
                align-items: center;
            }
            .arrow-link {
                width: 280px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="ai-section">
        <div class="sparks"></div>
        <div class="ai-globe"></div>
    </div>

    <div class="links-section">
        
        <a href="https://www.facebook.com/share/185AGVtNad/" class="arrow-link" target="_blank">
            <div class="icon-circle"><i class="fab fa-facebook-f"></i></div>
            <span>Facebook</span>
        </a>

        <a href="https://www.instagram.com/falahcanadi" class="arrow-link" target="_blank">
            <div class="icon-circle"><i class="fab fa-instagram"></i></div>
            <span>Instagram</span>
        </a>

        <a href="https://www.tiktok.com/@_tech_ai_" class="arrow-link" target="_blank">
            <div class="icon-circle"><i class="fab fa-tiktok"></i></div>
            <span>TikTok</span>
        </a>

        <a href="https://t.me/tech_ai_falah" class="arrow-link" target="_blank">
            <div class="icon-circle"><i class="fab fa-telegram"></i></div>
            <span>Telegram</span>
        </a>

        <a href="https://t.me/falahzakho_" class="arrow-link" target="_blank">
            <div class="icon-circle"><i class="fas fa-envelope"></i></div>
            <span>Message</span>
        </a>

    </div>
</div>

</body>
</html>
