<!DOCTYPE html>
<html lang="ku" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Rest | Luxury Grid Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        :root {
            --primary: #f59e0b; /* زێڕییێ شاهانە */
            --primary-glow: rgba(245, 158, 11, 0.25);
            --bg-color: #06080c; /* ڕەشێ کوور یێ گەردۆنی */
            --text-color: #f8fafc;
            --card-bg: rgba(17, 22, 32, 0.65); /* شووشەیێ کریستاڵی یێ تاری */
            --glass-border: rgba(255, 255, 255, 0.05);
            --nav-bg: rgba(6, 8, 12, 0.85);
            --price-color: #00ffa3; /* نیۆن لایڤ */
            --danger: #ef4444;
        }

        body.light-mode {
            --bg-color: #f1f5f9; 
            --text-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.06);
            --nav-bg: rgba(241, 245, 249, 0.85);
            --price-color: #059669;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            margin: 0; padding-bottom: 90px; min-height: 100vh; 
            color: var(--text-color);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.07), transparent 50%);
        }

        /* سەرپەرشتیا گشتی یا سەرەکی */
        .top-nav {
            display: flex; padding: 18px 24px;
            position: fixed; width: 100%; top: 0; z-index: 1000;
            justify-content: space-between; align-items: center;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-logo {
            font-weight: 900; font-size: 1.5rem; color: var(--primary); 
            letter-spacing: 1.5px; text-shadow: 0 0 15px var(--primary-glow);
        }

        .nav-actions { display: flex; gap: 10px; align-items: center; }

        .nav-btn {
            cursor: pointer; background: rgba(255,255,255,0.02);
            width: 42px; height: 42px; border-radius: 14px; 
            border: 1px solid var(--glass-border); 
            display: flex; align-items: center; justify-content: center; color: var(--text-color);
            font-size: 1.1rem;
        }
        .nav-btn:hover { background: var(--primary); color: #000; transform: translateY(-2px); box-shadow: 0 5px 12px var(--primary-glow); }
        .theme-toggle { background: rgba(245, 158, 11, 0.1); color: var(--primary); border: 1px solid rgba(245, 158, 11, 0.2); }

        header { padding: 100px 20px 5px; text-align: center; }
        .social-links { display: flex; justify-content: center; gap: 15px; margin-top: 5px; }
        .social-links a { color: var(--text-color); opacity: 0.5; font-size: 1.4rem; text-decoration: none; }
        .social-links a:hover { opacity: 1; color: var(--primary); transform: scale(1.15); }

        /* شریتا کاتیگۆریان یا لوکس */
        .categories-container { 
            position: sticky; top: 79px; z-index: 100; 
            background: var(--nav-bg); backdrop-filter: blur(20px); 
            padding: 12px 15px; overflow-x: auto; display: flex; gap: 10px;
            border-bottom: 1px solid var(--glass-border);
            scrollbar-width: none;
        }
        .categories-container::-webkit-scrollbar { display: none; }
        
        .cat-btn { 
            padding: 9px 24px; background: rgba(255,255,255,0.03); border-radius: 14px; 
            cursor: pointer; border: 1px solid var(--glass-border); white-space: nowrap; 
            color: var(--text-color); font-weight: 700; font-size: 0.9rem; opacity: 0.8;
        }
        .cat-btn.active { 
            background: linear-gradient(135deg, var(--primary), #b45309); color: #000; border: none; 
            font-weight: 900; opacity: 1; box-shadow: 0 6px 15px rgba(245, 158, 11, 0.35); 
        }

        /* دیزاینێ جۆت یێ مۆدێرن (Grid Layout) */
        .food-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            padding: 15px; 
            max-width: 700px; 
            margin: 0 auto; 
        }
        
        .food-card {
            background: var(--card-bg); border-radius: 24px; overflow: hidden;
            border: 1px solid var(--glass-border); position: relative;
            display: flex; flex-direction: column; padding: 12px; gap: 12px;
            backdrop-filter: blur(15px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.25);
        }
        .food-card:hover { 
            transform: translateY(-5px); 
            border-color: rgba(245, 158, 11, 0.25);
            box-shadow: 0 15px 30px rgba(245, 158, 11, 0.1);
        }

        .food-img { 
            width: 100%; height: 130px; background-size: cover; background-position: center; 
            border-radius: 18px; box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.04);
        }
        
        .food-info { 
            display: flex; flex-direction: column; gap: 4px; text-align: right; width: 100%;
        }
        [dir="ltr"] .food-info { text-align: left; }

        .food-title { font-size: 1rem; font-weight: 700; margin: 0; line-height: 1.4; color: #fff; min-height: 2.8em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        body.light-mode .food-title { color: var(--text-color); }
        
        .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; width: 100%; }

        .price-tag { color: var(--price-color); font-weight: 900; font-size: 1.05rem; }
        
        /* دوگمەیێن کریارێ */
        .add-btn { 
            background: linear-gradient(135deg, var(--primary), #d97706); color: #000; border: none; 
            width: 36px; height: 36px; border-radius: 12px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
            box-shadow: 0 4px 10px var(--primary-glow);
        }
        .add-btn:hover { transform: scale(1.08); }
        
        .del-btn { 
            position: absolute; top: 18px; left: 18px;
            background: rgba(239, 68, 68, 0.85); color: #fff; border: none; 
            width: 32px; height: 32px; border-radius: 10px; cursor: pointer; display: none; 
            align-items: center; justify-content: center; font-size: 0.9rem; z-index: 10;
            backdrop-filter: blur(5px);
        }
        [dir="ltr"] .del-btn { left: auto; right: 18px; }

        /* سەلک (Cart Panel) */
        #cart-panel {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; 
            background: #0b0e14; z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 25px; 
            display: flex; flex-direction: column; box-shadow: -15px 0 40px rgba(0,0,0,0.5);
            border-left: 1px solid var(--glass-border); backdrop-filter: blur(20px);
        }
        body.light-mode #cart-panel { background: #ffffff; }
        #cart-panel.open { right: 0; }
        [dir="ltr"] #cart-panel { right: auto; left: -100%; border-left: none; border-right: 1px solid var(--glass-border); }
        [dir="ltr"] #cart-panel.open { left: 0; }

        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--glass-border); }
        .cart-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 30px; height: 30px; border-radius: 10px; border: none; background: var(--primary); color: #000; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* پۆپ ئەپ مۆدال */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #121620; padding: 30px; border-radius: 28px; width: 100%; max-width: 380px; text-align: center; color: var(--text-color); border: 1px solid var(--glass-border); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        body.light-mode .modal-card { background: #fff; }
        .modal-card input, .modal-card select { width: 100%; padding: 14px; margin: 10px 0; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.02); color: var(--text-color); font-family: inherit; font-size: 1rem; }
        body.light-mode .modal-card input, body.light-mode .modal-card select { background: #f1f5f9; }

        #admin-add-trigger {
            position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--primary), #d97706); color: #000; border-radius: 18px;
            display: none; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            cursor: pointer; z-index: 1500; transform: rotate(45deg);
        }
        #admin-add-trigger i { transform: rotate(-45deg); }
        [dir="ltr"] #admin-add-trigger { left: auto; right: 30px; }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="nav-logo">TECH REST</div>
    <div class="nav-actions">
        <div class="nav-btn theme-toggle" onclick="toggleTheme()"><i id="theme-icon" class="fas fa-sun"></i></div>
        <div class="nav-btn" onclick="openLoginModal()"><i class="fas fa-user-shield"></i></div>
        <div class="nav-btn" onclick="toggleLang()"><span id="lang-label" style="font-weight: 900; font-size: 0.85rem;">KU</span></div>
        <div class="nav-btn" onclick="toggleCart()" style="position: relative;">
            <i class="fas fa-shopping-bag" style="color: var(--primary);"></i>
            <span id="cart-count" style="position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; border-radius: 50%; width: 19px; height: 19px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 0 8px rgba(239,68,68,0.4);">0</span>
        </div>
    </div>
</div>

<header>
    <div class="social-links">
        <a href="https://www.tiktok.com/@_tech_ai_?_r=1&_t=ZS-96F7xvMB0zP" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://www.instagram.com/__tech_.ai._?igsh=MTZ2ZGIxcXB2YjVjaw%3D%3D&utm_source=qr" target="_blank"><i class="fab fa-instagram"></i></a>
    </div>
</header>

<div id="cart-panel">
    <h2 id="t-cart-title" style="color: var(--primary); margin-top: 0; font-weight: 900;">سەلکا من</h2>
    <div id="cart-list" style="flex-grow:1; overflow-y:auto;"></div>
    <div style="padding:20px 0; border-top:1px solid var(--glass-border);">
        <span id="t-total-label">کۆمێ گشتی:</span>
        <h2 style="margin:5px 0; color: var(--price-color); font-weight: 900;"><span id="grand-total">0</span> IQD</h2>
    </div>
    <button style="background: rgba(239, 68, 68, 0.08); color: var(--danger); padding: 15px; border-radius: 14px; border:1px solid rgba(239,68,68,0.15); margin-bottom:12px; cursor:pointer; width:100%; font-weight:700;" onclick="clearCart()" id="t-clear-btn">پاککرنا سەلکێ</button>
    <button style="background: linear-gradient(135deg, var(--primary), #d97706); color: #000; padding: 15px; border-radius: 14px; border:none; cursor:pointer; width:100%; font-weight:900; box-shadow: 0 4px 12px var(--primary-glow);" onclick="toggleCart()" id="t-close-btn">بەردەوام بە</button>
</div>

<div id="login-modal" class="modal">
    <div class="modal-card">
        <h3 id="t-login-title" style="margin-top:0; font-weight:900; color:var(--primary);">چوونا ژوورێ (Admin)</h3>
        <input type="text" id="admin-user" placeholder="User Name">
        <input type="password" id="admin-pass" placeholder="Password">
        <button onclick="handleLogin()" style="width:100%; padding:14px; background:linear-gradient(135deg, var(--primary), #d97706); border:none; border-radius:14px; font-weight:900; cursor:pointer; color:#000;" id="t-next-btn">Next</button>
        <button onclick="closeModal('login-modal')" style="background:none; border:none; color:var(--text-color); margin-top:15px; cursor:pointer; opacity: 0.5;" id="t-cancel-login">داخستن</button>
    </div>
</div>

<div id="add-modal" class="modal">
    <div class="modal-card">
        <h3 id="t-add-title" style="margin-top:0; font-weight:900; color:var(--primary);">زێدەکرنا ئایتمێ نوو</h3>
        <input type="text" id="new-name-ku" placeholder="ناڤ ب کوردی">
        <input type="text" id="new-name-en" placeholder="ناڤ ب ئینگلیزی">
        <input type="text" id="new-name-ar" placeholder="ناڤ ب عەرەبی">
        <input type="text" id="new-price" placeholder="بها (نموونە: 5,000)">
        <input type="text" id="new-img" placeholder="لینکا وێنەی">
        <select id="new-cat"></select>
        <button onclick="addNewItem()" style="width:100%; padding:14px; background:linear-gradient(135deg, var(--primary), #d97706); border:none; border-radius:14px; font-weight:900; color:#000;" id="t-save-btn">زێدە بکە</button>
        <button onclick="closeModal('add-modal')" style="background:none; border:none; color:var(--text-color); margin-top:15px;" id="t-cancel-add">پەشیمان بوون</button>
    </div>
</div>

<div id="admin-add-trigger" onclick="openAddModal()"><i class="fas fa-plus"></i></div>

<div class="categories-container" id="catBar"></div>
<div id="menuContent"></div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSRjwZs-DPmh8Cg7LwOa1HTa8m58e4LriIPHbkoxdNp-vcgkNHHsVnp89Dj_TE7xiDLMugKBJRtsBr/pub?output=csv';
    let dataList = [], cart = {}, currentLang = 'ku', isAdmin = false;

    const translations = {
        ku: {
            cartTitle: "سەلکا من", total: "کۆمێ گشتی:", clear: "پاککرنا سەلکێ", close: "بەردەوام بە",
            login: "چوونا ژوورێ (Admin)", next: "Next", cancel: "داخستن", add: "زێدەکرنا ئایتمێ نوو",
            save: "زێدە بکە", undo: "پەشیمان بوون", delConf: "تو پشت راستی ژ رەشکرنێ؟", welcome: "بخێرهاتی رێڤەبەر فەلاح"
        },
        en: {
            cartTitle: "My Cart", total: "Total:", clear: "Clear Cart", close: "Continue",
            login: "Admin Login", next: "Next", cancel: "Close", add: "Add New Item",
            save: "Add Now", undo: "Cancel", delConf: "Are you sure you want to delete?", welcome: "Welcome Admin Falah"
        },
        ar: {
            cartTitle: "سلتي", total: "المجموع:", clear: "تفريغ السلة", close: "استمرار",
            login: "دخول المشرف", next: "التالي", cancel: "اغلاق", add: "اضافة مادة جديدة",
            save: "اضافة", undo: "الغاء", delConf: "هل انت متأكد من الحذف؟", welcome: "اهلا بك ايها المدير فلاح"
        }
    };

    async function loadData() {
        try {
            const res = await fetch(csvUrl);
            const txt = await res.text();
            const rows = txt.split('\n').slice(1);
            const sheetsData = rows.map(r => {
                const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                return { id: c[0], price: c[1], img: c[2], cat: c[3], name_ku: c[4] || c[0], name_ar: c[5] || c[0], name_en: c[0] };
            }).filter(i => i.id);

            const localItems = JSON.parse(localStorage.getItem('addedItems') || '[]');
            dataList = [...sheetsData, ...localItems];
            renderMenu();
            updateUIStrings();
        } catch (e) { console.error(e); }
    }

    function updateUIStrings() {
        const t = translations[currentLang];
        document.getElementById('t-cart-title').innerText = t.cartTitle;
        document.getElementById('t-total-label').innerText = t.total;
        document.getElementById('t-clear-btn').innerText = t.clear;
        document.getElementById('t-close-btn').innerText = t.close;
        document.getElementById('t-login-title').innerText = t.login;
        document.getElementById('t-next-btn').innerText = t.next;
        document.getElementById('t-cancel-login').innerText = t.cancel;
        document.getElementById('t-add-title').innerText = t.add;
        document.getElementById('t-save-btn').innerText = t.save;
        document.getElementById('t-cancel-add').innerText = t.undo;
    }

    function renderMenu() {
        const catBar = document.getElementById('catBar');
        const menuContent = document.getElementById('menuContent');
        const catSelect = document.getElementById('new-cat');
        catBar.innerHTML = ''; menuContent.innerHTML = ''; catSelect.innerHTML = '';
        
        const cats = [...new Set(dataList.map(i => i.cat))];
        cats.forEach((cat, index) => {
            catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
            const btn = document.createElement('div');
            btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.menu-section').forEach(s => s.style.display = 'none');
                document.getElementById(`sec-${cat.replace(/\s+/g, '-')}`).style.display = 'block';
            };
            catBar.appendChild(btn);

            const section = document.createElement('div');
            section.id = `sec-${cat.replace(/\s+/g, '-')}`;
            section.className = 'menu-section';
            section.style.display = index === 0 ? 'block' : 'none';
            const grid = document.createElement('div');
            grid.className = 'food-grid';

            dataList.filter(f => f.cat === cat).forEach(food => {
                const name = currentLang === 'ku' ? food.name_ku : (currentLang === 'ar' ? food.name_ar : food.name_en);
                grid.innerHTML += `
                    <div class="food-card">
                        <button class="del-btn" style="display:${isAdmin?'flex':'none'}" onclick="deleteItem('${food.id}')"><i class="fas fa-trash"></i></button>
                        <div class="food-img" style="background-image: url('${food.img}')"></div>
                        <div class="food-info">
                            <h3 class="food-title">${name}</h3>
                            <div class="card-bottom">
                                <span class="price-tag">${food.price}</span>
                                <button class="add-btn" onclick="addToCart('${food.id}')"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>`;
            });
            section.appendChild(grid);
            menuContent.appendChild(section);
        });
    }

    function handleLogin() {
        const u = document.getElementById('admin-user').value;
        const p = document.getElementById('admin-pass').value;
        if(u === 'falahzakho' && p === 'falah243') {
            isAdmin = true;
            document.getElementById('admin-add-trigger').style.display = 'flex';
            closeModal('login-modal');
            renderMenu();
            alert(translations[currentLang].welcome);
        } else {
            alert("Error!");
        }
    }

    function addNewItem() {
        const newItem = {
            id: 'local-' + Date.now(),
            name_ku: document.getElementById('new-name-ku').value,
            name_en: document.getElementById('new-name-en').value,
            name_ar: document.getElementById('new-name-ar').value,
            price: document.getElementById('new-price').value,
            img: document.getElementById('new-img').value,
            cat: document.getElementById('new-cat').value
        };
        let locals = JSON.parse(localStorage.getItem('addedItems') || '[]');
        locals.push(newItem);
        localStorage.setItem('addedItems', JSON.stringify(locals));
        dataList.push(newItem);
        renderMenu();
        closeModal('add-modal');
    }

    function deleteItem(id) {
        if(confirm(translations[currentLang].delConf)) {
            dataList = dataList.filter(i => i.id !== id);
            let locals = JSON.parse(localStorage.getItem('addedItems') || '[]').filter(i => i.id !== id);
            localStorage.setItem('addedItems', JSON.stringify(locals));
            renderMenu();
        }
    }

    function addToCart(id) {
        const item = dataList.find(i => i.id === id);
        if(cart[id]) cart[id].qty++;
        else cart[id] = {...item, qty: 1};
        updateCartUI();
    }

    function updateCartUI() {
        const list = document.getElementById('cart-list');
        list.innerHTML = '';
        let totalItems = 0, grandTotal = 0;
        Object.values(cart).forEach(item => {
            totalItems += item.qty;
            let priceNum = parseInt(item.price.replace(/,/g, '').replace(/[^\d]/g, '')) || 0;
            grandTotal += (priceNum * item.qty);
            const name = currentLang === 'ku' ? item.name_ku : (currentLang === 'ar' ? item.name_ar : item.name_en);
            list.innerHTML += `<div class="cart-item">
                <div style="flex-grow:1;"><b>${name}</b><br><small style="color:var(--price-color); font-weight:700;">${item.price}</small></div>
                <div class="cart-controls">
                    <button class="qty-btn" onclick="changeQty('${item.id}',-1)">-</button>
                    <span style="font-weight:700;">${item.qty}</span>
                    <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
                </div>
            </div>`;
        });
        document.getElementById('cart-count').innerText = totalItems;
        document.getElementById('grand-total').innerText = grandTotal.toLocaleString();
    }

    function changeQty(id, d) {
        cart[id].qty += d;
        if(cart[id].qty <= 0) delete cart[id];
        updateCartUI();
    }

    function toggleLang() {
        currentLang = currentLang === 'ku' ? 'en' : (currentLang === 'en' ? 'ar' : 'ku');
        document.getElementById('lang-label').innerText = currentLang.toUpperCase();
        document.getElementById('mainHtml').dir = currentLang === 'en' ? 'ltr' : 'rtl';
        updateUIStrings();
        renderMenu();
        updateCartUI();
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        document.getElementById('theme-icon').className = document.body.classList.contains('light-mode') ? 'fas fa-moon' : 'fas fa-sun';
    }

    function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
    function openAddModal() { document.getElementById('add-modal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleCart() { document.getElementById('cart-panel').classList.toggle('open'); }
    function clearCart() { cart = {}; updateCartUI(); }

    loadData();
</script>
</body>
</html>
